name: Tailscale Phone Service End-to-End Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/tailscale-phone-service-test.yml

concurrency:
  group: tailscale-phone-service-e2e-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join tailnet as ephemeral phone host
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_API_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_API_CLIENT_SECRET }}
          tags: tag:github-phone
          hostname: gh-phone001-test-${{ github.run_id }}
          version: latest
          log-mode: normal

      - name: Start local TCP proof service
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ts_phone_test.py <<'PY'
          import socketserver

          class Handler(socketserver.BaseRequestHandler):
              def handle(self):
                  self.request.sendall(b"TS_PHONE_TEST_OK\n")

          class Server(socketserver.ThreadingTCPServer):
              allow_reuse_address = True

          Server(("127.0.0.1", 5555), Handler).serve_forever()
          PY
          nohup python3 /tmp/ts_phone_test.py >/tmp/ts_phone_test.log 2>&1 &
          echo $! >/tmp/ts_phone_test.pid
          for _ in $(seq 1 20); do
            nc -z 127.0.0.1 5555 && break
            sleep 1
          done
          nc -z 127.0.0.1 5555
          echo "LOCAL_TCP_5555_OK"

      - name: Expose TCP 5555 on runner Tailscale IP
        shell: bash
        run: |
          set -euo pipefail
          sudo -E tailscale serve --yes --tcp=5555 tcp://127.0.0.1:5555
          sudo -E tailscale serve status | grep -q 'tcp://.*:5555'
          echo "TAILSCALE_NODE_TCP_5555_READY"

      - name: Advertise and verify phone001 Tailscale Service
        shell: bash
        env:
          TS_API_CLIENT_ID: ${{ secrets.TS_API_CLIENT_ID }}
          TS_API_CLIENT_SECRET: ${{ secrets.TS_API_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          SERVICE='svc:phone001'

          sudo -E tailscale serve --yes --service="$SERVICE" --tcp=5555 tcp://127.0.0.1:5555
          sudo -E tailscale serve get-config --service="$SERVICE" | grep -q 'tcp:5555'

          SELF_ID=$(sudo -E tailscale status --json | jq -r '.Self.ID // empty')
          SUFFIX=$(sudo -E tailscale status --json | jq -r '.MagicDNSSuffix // empty')
          [ -n "$SELF_ID" ]
          [ -n "$SUFFIX" ]

          TOKEN_JSON=/tmp/ts-e2e-oauth.json
          HOSTS_JSON=/tmp/ts-e2e-hosts.json
          trap 'rm -f "$TOKEN_JSON" "$HOSTS_JSON"' EXIT
          curl -fsS -X POST \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$TS_API_CLIENT_ID" \
            --data-urlencode "client_secret=$TS_API_CLIENT_SECRET" \
            --data-urlencode 'scope=all' \
            https://api.tailscale.com/api/v2/oauth/token \
            -o "$TOKEN_JSON"
          TS_ACCESS_TOKEN=$(jq -r '.access_token // empty' "$TOKEN_JSON")
          [ -n "$TS_ACCESS_TOKEN" ]
          echo "::add-mask::$TS_ACCESS_TOKEN"
          unset TS_API_CLIENT_ID TS_API_CLIENT_SECRET

          ts_api() {
            curl -fsS -H "Authorization: Bearer $TS_ACCESS_TOKEN" -H 'Accept: application/json' "$@"
          }

          approved_ready() {
            ts_api "https://api.tailscale.com/api/v2/tailnet/-/services/$SERVICE/devices" -o "$HOSTS_JSON"
            jq -e --arg id "$SELF_ID" '.hosts[]? | select(.nodeId == $id) | (.approvalLevel | startswith("approved:")) and (.configured == "ready")' "$HOSTS_JSON" >/dev/null
          }

          for _ in $(seq 1 15); do
            approved_ready && break
            sleep 2
          done

          if ! approved_ready; then
            ts_api "https://api.tailscale.com/api/v2/tailnet/-/services/$SERVICE/devices" -o "$HOSTS_JSON"
            NODE_ID=$(jq -r --arg id "$SELF_ID" '.hosts[]? | select(.nodeId == $id) | .nodeId' "$HOSTS_JSON" | head -n1)
            [ -n "$NODE_ID" ] || { echo "::error::TAILSCALE_SERVICE_HOST_NOT_REGISTERED"; exit 1; }
            ts_api -X POST \
              -H 'Content-Type: application/json' \
              --data '{"approved":true}' \
              "https://api.tailscale.com/api/v2/tailnet/-/services/$SERVICE/device/$NODE_ID/approved" \
              -o /dev/null
            sleep 3
            sudo -E tailscale serve --yes --service="$SERVICE" --tcp=5555 tcp://127.0.0.1:5555
          fi

          for _ in $(seq 1 20); do
            approved_ready && break
            sleep 2
          done
          approved_ready || { echo "::error::TAILSCALE_SERVICE_HOST_NOT_READY"; exit 1; }

          sudo -E tailscale status --json | jq -e '.Self.CapMap."service-host" != null' >/dev/null
          FQDN="phone001.$SUFFIX"
          echo "TS_PHONE_FQDN=$FQDN"

          PROBE=$(timeout 10 nc -w 5 "$FQDN" 5555 | tr -d '\r' | head -n1 || true)
          [ "$PROBE" = 'TS_PHONE_TEST_OK' ] || { echo "::error::TAILSCALE_SERVICE_LOCAL_PROBE_FAILED"; exit 1; }
          echo "TAILSCALE_SERVICE_LOCAL_PROBE_OK"
          echo "TAILSCALE_PHONE_SERVICE_READY"

      - name: Hold for Windows end-to-end probe
        shell: bash
        run: |
          echo "TAILSCALE_PHONE_SERVICE_HOLD_START"
          sleep 240
          echo "TAILSCALE_PHONE_SERVICE_HOLD_END"
