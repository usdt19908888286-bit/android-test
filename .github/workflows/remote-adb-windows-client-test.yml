name: Remote ADB Windows Client Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/remote-adb-windows-client-test.yml

jobs:
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CLOUD_PHONE_SECRETS: ${{ secrets.CLOUD_PHONE_SECRETS }}

    steps:
      - name: Prepare Windows Cloudflare ADB client
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:CLOUD_PHONE_SECRETS)) {
            Write-Host 'WINDOWS_ADB_CLIENT_CONFIG_FAILED'
            exit 1
          }

          try {
            $cfg = $env:CLOUD_PHONE_SECRETS | ConvertFrom-Json
          } catch {
            Write-Host 'WINDOWS_ADB_CLIENT_CONFIG_FAILED'
            exit 1
          }

          $zone = [string]$cfg.cf_zone
          $adbInput = [string]$cfg.cf_adb_hostname
          if ([string]::IsNullOrWhiteSpace($zone) -or [string]::IsNullOrWhiteSpace($adbInput)) {
            Write-Host 'WINDOWS_ADB_CLIENT_CONFIG_FAILED'
            exit 1
          }

          if ($adbInput.Contains('.')) {
            if (-not $adbInput.EndsWith('.' + $zone)) {
              Write-Host 'WINDOWS_ADB_CLIENT_CONFIG_FAILED'
              exit 1
            }
            $adbHostname = $adbInput
          } else {
            $adbHostname = "$adbInput.$zone"
          }

          "ADB_HOSTNAME=$adbHostname" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $cf = Join-Path $env:RUNNER_TEMP 'cloudflared.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $cf

          $zip = Join-Path $env:RUNNER_TEMP 'platform-tools.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $adb = Join-Path $env:RUNNER_TEMP 'platform-tools\adb.exe'

          if (-not (Test-Path $cf) -or -not (Test-Path $adb)) {
            Write-Host 'WINDOWS_ADB_CLIENT_PREP_FAILED'
            exit 1
          }

          "CLOUDFLARED_EXE=$cf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ADB_EXE=$adb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'WINDOWS_ADB_CLIENT_PREPARED'

      - name: Verify public ADB through Cloudflare
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $cfOut = Join-Path $env:RUNNER_TEMP 'cloudflared-access.out.log'
          $cfErr = Join-Path $env:RUNNER_TEMP 'cloudflared-access.err.log'
          Write-Host 'CF_ACCESS_CLIENT_STARTING'

          $cfProc = Start-Process -FilePath $env:CLOUDFLARED_EXE `
            -ArgumentList @('access','tcp','--hostname',$env:ADB_HOSTNAME,'--url','127.0.0.1:15555') `
            -RedirectStandardOutput $cfOut `
            -RedirectStandardError $cfErr `
            -PassThru `
            -WindowStyle Hidden

          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($cfProc.HasExited) { break }
              $tcp = Test-NetConnection -ComputerName 127.0.0.1 -Port 15555 -WarningAction SilentlyContinue
              if ($tcp.TcpTestSucceeded) {
                $ready = $true
                break
              }
              Start-Sleep -Seconds 1
            }

            if (-not $ready) {
              Write-Host 'CF_ACCESS_CLIENT_FAILED'
              exit 1
            }
            Write-Host 'CF_ACCESS_CLIENT_CONNECTED'

            # Windows PowerShell 5.1 promotes native stderr to error records when
            # ErrorActionPreference=Stop. ADB legitimately writes daemon startup
            # messages to stderr, so use exit codes for the native ADB calls.
            $ErrorActionPreference = 'Continue'
            & $env:ADB_EXE start-server 2>&1 | Out-Null
            $adbStartExit = $LASTEXITCODE
            & $env:ADB_EXE connect 127.0.0.1:15555 2>&1 | Out-Null
            $adbConnectExit = $LASTEXITCODE

            $state = (& $env:ADB_EXE -s 127.0.0.1:15555 get-state 2>$null | Out-String).Trim()
            $stateExit = $LASTEXITCODE
            if ($adbStartExit -ne 0 -or $adbConnectExit -ne 0 -or $stateExit -ne 0 -or $state -ne 'device') {
              Write-Host 'PUBLIC_ADB_CONNECT_FAILED'
              exit 1
            }
            Write-Host 'PUBLIC_ADB_CONNECT_OK'

            $id = (& $env:ADB_EXE -s 127.0.0.1:15555 shell id 2>$null | Out-String).Trim()
            $idExit = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($idExit -ne 0 -or $id -notmatch 'uid=0\(root\)') {
              Write-Host 'PUBLIC_ADB_ROOT_FAILED'
              exit 1
            }

            Write-Host 'PUBLIC_ADB_ROOT_OK'
            Write-Host 'PUBLIC_ADB_END_TO_END_OK'
          } finally {
            if ($cfProc -and -not $cfProc.HasExited) {
              Stop-Process -Id $cfProc.Id -Force -ErrorAction SilentlyContinue
            }
            & $env:ADB_EXE kill-server 2>$null | Out-Null
          }
