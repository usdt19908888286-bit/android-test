name: Android Cloud Phone 4C8G S5
on:
  workflow_dispatch:
    inputs:
      phone_id:
        description: Logical cloud phone ID (for example 001)
        required: true
        default: '001'
        type: string

permissions:
  contents: read

concurrency:
  group: android-cloud-phone-${{ inputs.phone_id }}
  cancel-in-progress: true

jobs:
  cloud-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DISPLAY: :99
      PHONE_ID: ${{ inputs.phone_id }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      APK_URL: https://download.binance.com/pack/BNApp64.apk
      AVD_NAME: full-avd-api35-pixel6-frida-v2
      AVD_CACHE_KEY: full-avd-api35-pixel6-frida-cold-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_API_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_API_CLIENT_SECRET }}
          tags: tag:github-phone
          hostname: phone${{ inputs.phone_id }}-gh-${{ github.run_id }}
          version: latest
          log-mode: normal

      - name: Verify Tailscale connection
        shell: bash
        run: |
          set -euo pipefail
          case "${PHONE_ID:-}" in
            ''|*[!0-9]*) echo "::error::PHONE_ID must contain digits only"; exit 1 ;;
          esac
          TS_IPV4=$(tailscale ip -4 | head -n1)
          [ -n "$TS_IPV4" ] || { echo "::error::TAILSCALE_IPV4_MISSING"; exit 1; }
          tailscale status --json | jq -e '.BackendState == "Running" or .Self.Online == true' >/dev/null
          echo "TAILSCALE_CONNECTED"
          echo "TAILSCALE_NODE_IPV4=$TS_IPV4"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Restore clean Frida Golden AVD
        id: avd-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.android/avd/*
          key: ${{ env.AVD_CACHE_KEY }}

      - name: Require clean Frida Golden AVD
        run: |
          if [ "${{ steps.avd-restore.outputs.cache-hit }}" != "true" ]; then
            echo "::error::FRIDA_GOLDEN_CACHE_MISS"
            exit 1
          fi
          echo "FRIDA_GOLDEN_CACHE_HIT"

      - name: Prepare remote desktop, SOCKS5, Cloudflare and ADB input
        env:
          S5_HOST: ${{ secrets.S5_HOST }}
          S5_PORT: ${{ secrets.S5_PORT }}
          S5_USER: ${{ secrets.S5_USER }}
          S5_PASS: ${{ secrets.S5_PASS }}
          CLOUD_PHONE_SECRETS: ${{ secrets.CLOUD_PHONE_SECRETS }}
        run: |
          set -e
          if [ -z "${VNC_PASSWORD:-}" ]; then
            echo "::error::Missing VNC_PASSWORD secret."
            exit 1
          fi
          if [ -z "${S5_HOST:-}" ] || [ -z "${S5_PORT:-}" ]; then
            echo "::error::Missing S5_HOST or S5_PORT repository secret."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify curl jq openssl netcat-openbsd libpulse0 unzip xdotool wmctrl python3-pip
          python3 -m pip install --quiet --break-system-packages PySocks

          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          sleep 2
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass >/dev/null

          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

          cf_fail() {
            echo "CF_TUNNEL_FAILED"
            exit 1
          }

          if [ -z "${CLOUD_PHONE_SECRETS:-}" ] || ! jq -e . >/dev/null 2>&1 <<<"$CLOUD_PHONE_SECRETS"; then
            cf_fail
          fi

          CF_API_TOKEN=$(jq -r '.cf_api_token // empty' <<<"$CLOUD_PHONE_SECRETS")
          CF_ZONE=$(jq -r '.cf_zone // empty' <<<"$CLOUD_PHONE_SECRETS")
          CF_ADB_INPUT=$(jq -r '.cf_adb_hostname // empty' <<<"$CLOUD_PHONE_SECRETS")
          CF_PHONE_INPUT=$(jq -r '.cf_phone_hostname // empty' <<<"$CLOUD_PHONE_SECRETS")
          unset CLOUD_PHONE_SECRETS

          [ -n "$CF_API_TOKEN" ] || cf_fail
          [ -n "$CF_ZONE" ] || cf_fail
          [ -n "$CF_ADB_INPUT" ] || cf_fail
          [ -n "$CF_PHONE_INPUT" ] || cf_fail

          normalize_hostname() {
            local value="$1"
            case "$value" in
              *.*)
                case "$value" in *.$CF_ZONE) printf '%s' "$value" ;; *) return 1 ;; esac
                ;;
              *) printf '%s.%s' "$value" "$CF_ZONE" ;;
            esac
          }

          CF_ADB_HOSTNAME=$(normalize_hostname "$CF_ADB_INPUT") || cf_fail
          CF_PHONE_HOSTNAME=$(normalize_hostname "$CF_PHONE_INPUT") || cf_fail
          unset CF_ADB_INPUT CF_PHONE_INPUT
          [ "$CF_ADB_HOSTNAME" != "$CF_PHONE_HOSTNAME" ] || cf_fail

          echo "::add-mask::$CF_API_TOKEN"
          printf 'header = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "$CF_API_TOKEN" >/tmp/cf-curl.conf
          chmod 600 /tmp/cf-curl.conf

          cf_curl() {
            curl -fsS --config /tmp/cf-curl.conf "$@"
          }

          cf_curl -G 'https://api.cloudflare.com/client/v4/zones' \
            --data-urlencode "name=$CF_ZONE" \
            --data-urlencode 'status=active' \
            --data-urlencode 'per_page=1' \
            -o /tmp/cf-zone.json || cf_fail
          jq -e '.success == true and (.result | length) == 1' /tmp/cf-zone.json >/dev/null || cf_fail
          ZONE_ID=$(jq -r '.result[0].id // empty' /tmp/cf-zone.json)
          ACCOUNT_ID=$(jq -r '.result[0].account.id // empty' /tmp/cf-zone.json)
          [ -n "$ZONE_ID" ] && [ -n "$ACCOUNT_ID" ] || cf_fail

          TUNNEL_NAME="github-android-cloud-phone-${ZONE_ID:0:8}"
          cf_curl -G "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel" \
            --data-urlencode "name=$TUNNEL_NAME" \
            --data-urlencode 'is_deleted=false' \
            --data-urlencode 'per_page=100' \
            -o /tmp/cf-tunnels.json || cf_fail
          jq -e '.success == true' /tmp/cf-tunnels.json >/dev/null || cf_fail

          TUNNEL_ID=$(jq -r --arg name "$TUNNEL_NAME" '.result[]? | select(.name == $name and .config_src == "cloudflare") | .id' /tmp/cf-tunnels.json | head -n1)
          if [ -z "$TUNNEL_ID" ]; then
            if jq -e --arg name "$TUNNEL_NAME" '.result[]? | select(.name == $name)' /tmp/cf-tunnels.json >/dev/null; then
              cf_fail
            fi

            TUNNEL_SECRET=$(openssl rand -base64 32 | tr -d '\n')
            echo "::add-mask::$TUNNEL_SECRET"
            jq -n \
              --arg name "$TUNNEL_NAME" \
              --arg secret "$TUNNEL_SECRET" \
              '{name:$name, config_src:"cloudflare", tunnel_secret:$secret}' \
              >/tmp/cf-create-tunnel.json
            cf_curl -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel" \
              --data-binary @/tmp/cf-create-tunnel.json \
              -o /tmp/cf-created-tunnel.json || cf_fail
            jq -e '.success == true and (.result.id | length) > 0' /tmp/cf-created-tunnel.json >/dev/null || cf_fail
            TUNNEL_ID=$(jq -r '.result.id' /tmp/cf-created-tunnel.json)
            unset TUNNEL_SECRET
          fi

          jq -n \
            --arg adb "$CF_ADB_HOSTNAME" \
            --arg phone "$CF_PHONE_HOSTNAME" \
            '{config:{ingress:[
              {hostname:$adb,service:"tcp://localhost:5555"},
              {hostname:$phone,service:"http_status:404"},
              {service:"http_status:404"}
            ]}}' >/tmp/cf-ingress.json
          cf_curl -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" \
            --data-binary @/tmp/cf-ingress.json \
            -o /tmp/cf-config-result.json || cf_fail
          jq -e '.success == true' /tmp/cf-config-result.json >/dev/null || cf_fail

          upsert_tunnel_dns() {
            local hostname="$1"
            local target="$TUNNEL_ID.cfargotunnel.com"
            local record_id

            cf_curl -G "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              --data-urlencode "name=$hostname" \
              --data-urlencode 'per_page=100' \
              -o /tmp/cf-dns-list.json || cf_fail
            jq -e '.success == true' /tmp/cf-dns-list.json >/dev/null || cf_fail

            record_id=$(jq -r --arg hostname "$hostname" '.result[]? | select(.name == $hostname and .type == "CNAME") | .id' /tmp/cf-dns-list.json | head -n1)
            jq -n \
              --arg name "$hostname" \
              --arg content "$target" \
              '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1}' \
              >/tmp/cf-dns-write.json

            if [ -n "$record_id" ]; then
              cf_curl -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$record_id" \
                --data-binary @/tmp/cf-dns-write.json \
                -o /tmp/cf-dns-result.json || cf_fail
            else
              while IFS= read -r old_id; do
                [ -n "$old_id" ] || continue
                cf_curl -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$old_id" \
                  -o /tmp/cf-dns-delete.json || cf_fail
              done < <(jq -r --arg hostname "$hostname" '.result[]? | select(.name == $hostname) | .id' /tmp/cf-dns-list.json)

              cf_curl -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                --data-binary @/tmp/cf-dns-write.json \
                -o /tmp/cf-dns-result.json || cf_fail
            fi
            jq -e '.success == true' /tmp/cf-dns-result.json >/dev/null || cf_fail
          }

          upsert_tunnel_dns "$CF_ADB_HOSTNAME"
          upsert_tunnel_dns "$CF_PHONE_HOSTNAME"

          cf_curl "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/token" \
            -o /tmp/cf-tunnel-token-response.json || cf_fail
          jq -e '.success == true and (.result | type) == "string" and (.result | length) > 0' /tmp/cf-tunnel-token-response.json >/dev/null || cf_fail
          CF_TUNNEL_TOKEN=$(jq -r '.result' /tmp/cf-tunnel-token-response.json)
          echo "::add-mask::$CF_TUNNEL_TOKEN"
          printf '%s' "$CF_TUNNEL_TOKEN" >/tmp/cf_tunnel_token
          chmod 600 /tmp/cf_tunnel_token
          printf '%s' "$CF_ADB_HOSTNAME" >/tmp/cf_adb_hostname

          unset CF_API_TOKEN CF_TUNNEL_TOKEN
          rm -f /tmp/cf-curl.conf /tmp/cf-zone.json /tmp/cf-tunnels.json \
            /tmp/cf-create-tunnel.json /tmp/cf-created-tunnel.json \
            /tmp/cf-ingress.json /tmp/cf-config-result.json \
            /tmp/cf-dns-list.json /tmp/cf-dns-write.json /tmp/cf-dns-result.json \
            /tmp/cf-dns-delete.json /tmp/cf-tunnel-token-response.json

          cat >/tmp/s5_bridge.py <<'PY'
          import os
          import select
          import socketserver
          from urllib.parse import urlsplit
          import socks

          S5_HOST = os.environ["S5_HOST"]
          S5_PORT = int(os.environ["S5_PORT"])
          S5_USER = os.environ.get("S5_USER") or None
          S5_PASS = os.environ.get("S5_PASS") or None

          def open_upstream(host, port):
              s = socks.socksocket()
              s.set_proxy(socks.SOCKS5, S5_HOST, S5_PORT, rdns=True,
                          username=S5_USER, password=S5_PASS)
              s.settimeout(30)
              s.connect((host, int(port)))
              s.settimeout(None)
              return s

          def relay(a, b):
              sockets = [a, b]
              while True:
                  readable, _, _ = select.select(sockets, [], [], 60)
                  if not readable:
                      continue
                  for src in readable:
                      dst = b if src is a else a
                      data = src.recv(65536)
                      if not data:
                          return
                      dst.sendall(data)

          class Handler(socketserver.BaseRequestHandler):
              def handle(self):
                  client = self.request
                  client.settimeout(30)
                  data = b""
                  while b"\r\n\r\n" not in data and len(data) < 65536:
                      chunk = client.recv(4096)
                      if not chunk:
                          return
                      data += chunk
                  if b"\r\n\r\n" not in data:
                      return

                  head, rest = data.split(b"\r\n\r\n", 1)
                  lines = head.split(b"\r\n")
                  parts = lines[0].decode("latin1").split(" ", 2)
                  if len(parts) != 3:
                      return
                  method, target, version = parts

                  try:
                      if method.upper() == "CONNECT":
                          host, port = target.rsplit(":", 1)
                          host = host.strip("[]")
                          upstream = open_upstream(host, int(port))
                          client.sendall(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                          if rest:
                              upstream.sendall(rest)
                          relay(client, upstream)
                          upstream.close()
                          return

                      parsed = urlsplit(target)
                      if parsed.hostname:
                          host = parsed.hostname
                          port = parsed.port or 80
                          path = parsed.path or "/"
                          if parsed.query:
                              path += "?" + parsed.query
                      else:
                          host_header = ""
                          for line in lines[1:]:
                              if line.lower().startswith(b"host:"):
                                  host_header = line.split(b":", 1)[1].strip().decode("latin1")
                                  break
                          if not host_header:
                              return
                          if ":" in host_header:
                              host, port = host_header.rsplit(":", 1)
                              port = int(port)
                          else:
                              host, port = host_header, 80
                          path = target

                      upstream = open_upstream(host, port)
                      lines[0] = f"{method} {path} {version}".encode("latin1")
                      upstream.sendall(b"\r\n".join(lines) + b"\r\n\r\n" + rest)
                      relay(client, upstream)
                      upstream.close()
                  except Exception:
                      try:
                          client.sendall(b"HTTP/1.1 502 Bad Gateway\r\nContent-Length: 0\r\n\r\n")
                      except Exception:
                          pass

          class Server(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True

          Server(("127.0.0.1", 8118), Handler).serve_forever()
          PY

          cat >/tmp/s5_bridge_supervisor.sh <<'SH'
          #!/usr/bin/env bash
          set -u
          while true; do
            python3 /tmp/s5_bridge.py >>/tmp/s5_bridge.log 2>&1
            echo "SOCKS5_BRIDGE_RESTARTING" >>/tmp/s5_bridge.log
            sleep 2
          done
          SH
          chmod +x /tmp/s5_bridge_supervisor.sh
          : >/tmp/s5_bridge.log
          nohup /tmp/s5_bridge_supervisor.sh >/dev/null 2>&1 &
          S5_BRIDGE_PID=$!
          echo "$S5_BRIDGE_PID" >/tmp/s5_bridge_supervisor.pid
          sleep 1
          if ! kill -0 "$S5_BRIDGE_PID" 2>/dev/null; then
            echo "::error::SOCKS5 local bridge failed to start."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import socks
          try:
              s = socks.socksocket()
              s.set_proxy(
                  socks.SOCKS5,
                  os.environ["S5_HOST"],
                  int(os.environ["S5_PORT"]),
                  rdns=True,
                  username=os.environ.get("S5_USER") or None,
                  password=os.environ.get("S5_PASS") or None,
              )
              s.settimeout(12)
              s.connect(("www.cloudflare.com", 443))
              s.close()
              print("SOCKS5_UPSTREAM_OK")
          except Exception:
              print("SOCKS5_UPSTREAM_FAILED")
              raise SystemExit(1)
          PY

          if curl -fsS --proxy http://127.0.0.1:8118 --connect-timeout 10 --max-time 20 https://www.cloudflare.com/cdn-cgi/trace -o /dev/null; then
            echo "SOCKS5_BRIDGE_OK"
          else
            echo "SOCKS5_BRIDGE_FAILED"
            exit 1
          fi

          cat >/tmp/adb_input_server.py <<'PY'
          import base64
          import os
          import subprocess
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import parse_qs

          USER = "adb"
          PASSWORD = os.environ["VNC_PASSWORD"]
          KEYEVENTS = {
              "enter": "66",
              "backspace": "67",
              "tab": "61",
              "home": "3",
              "back": "4",
          }

          PAGE = """<!doctype html>
          <html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
          <title>ADB Input</title>
          <style>
          body{font-family:system-ui,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;background:#111;color:#eee}
          textarea{width:100%;min-height:120px;font-size:18px;padding:10px;box-sizing:border-box}
          button{font-size:16px;padding:10px 14px;margin:6px 4px 6px 0}
          .ok{color:#8f8}.note{color:#bbb}
          </style></head><body>
          <h2>Android ADB Remote Input</h2>
          <p class='note'>先在 VNC 里点中 Binance 输入框，再回这里发送。文字直接通过 ADB 注入，不依赖软键盘。</p>
          <form method='post'>
          <textarea name='text' placeholder='输入要发送到 Android 当前焦点输入框的文字'></textarea><br>
          <button name='action' value='text'>发送文字</button>
          <button name='action' value='enter'>Enter</button>
          <button name='action' value='backspace'>Backspace</button>
          <button name='action' value='tab'>Tab</button>
          <button name='action' value='back'>Android Back</button>
          <button name='action' value='home'>Android Home</button>
          </form>{message}</body></html>"""

          class Handler(BaseHTTPRequestHandler):
              def authorized(self):
                  expected = "Basic " + base64.b64encode(f"{USER}:{PASSWORD}".encode()).decode()
                  return self.headers.get("Authorization", "") == expected

              def auth(self):
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="ADB Input"')
                  self.end_headers()

              def render(self, message=""):
                  body = PAGE.replace("{message}", message).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "text/html; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if not self.authorized():
                      return self.auth()
                  self.render()

              def do_POST(self):
                  if not self.authorized():
                      return self.auth()
                  length = int(self.headers.get("Content-Length", "0"))
                  form = parse_qs(self.rfile.read(length).decode("utf-8"))
                  action = form.get("action", [""])[0]
                  try:
                      if action == "text":
                          text = form.get("text", [""])[0]
                          if len(text) > 2000:
                              raise ValueError("too long")
                          encoded = text.replace(" ", "%s")
                          subprocess.run(["adb", "shell", "input", "text", encoded], check=True, timeout=20)
                      elif action in KEYEVENTS:
                          subprocess.run(["adb", "shell", "input", "keyevent", KEYEVENTS[action]], check=True, timeout=20)
                      else:
                          raise ValueError("unknown action")
                      self.render("<p class='ok'>ADB command sent.</p>")
                  except Exception:
                      self.render("<p>ADB command failed.</p>")

              def log_message(self, fmt, *args):
                  pass

          ThreadingHTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY

          cat >/tmp/cloud-phone.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -u

          pid_alive() {
            local file="$1" pid=""
            [ -f "$file" ] || return 1
            pid=$(cat "$file" 2>/dev/null || true)
            [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null
          }

          start_x11vnc() {
            nohup x11vnc -display :99 -rfbauth /tmp/vnc.pass -forever -shared -localhost -rfbport 5900 >/tmp/x11vnc.log 2>&1 &
            echo $! >/tmp/x11vnc.pid
          }

          start_novnc() {
            nohup websockify --web=/usr/share/novnc 6080 localhost:5900 >/tmp/novnc.log 2>&1 &
            echo $! >/tmp/novnc.pid
          }

          start_adb_input() {
            nohup python3 /tmp/adb_input_server.py >/tmp/adb_input.log 2>&1 &
            echo $! >/tmp/adb_input.pid
          }

          start_vnc_tunnel() {
            : >/tmp/cloudflared_vnc.log
            nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 >/tmp/cloudflared_vnc.log 2>&1 &
            echo $! >/tmp/cloudflared_vnc.pid
            VNC_URL=""
            for _ in $(seq 1 50); do
              VNC_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared_vnc.log | head -n1 || true)
              [ -n "$VNC_URL" ] && return 0
              if ! pid_alive /tmp/cloudflared_vnc.pid; then break; fi
              sleep 1
            done
            if pid_alive /tmp/cloudflared_vnc.pid; then kill "$(cat /tmp/cloudflared_vnc.pid)" >/dev/null 2>&1 || true; fi
            rm -f /tmp/cloudflared_vnc.pid
            return 1
          }

          start_adb_input_tunnel() {
            : >/tmp/cloudflared_adb_input.log
            nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 >/tmp/cloudflared_adb_input.log 2>&1 &
            echo $! >/tmp/cloudflared_adb_input.pid
            ADB_INPUT_URL=""
            for _ in $(seq 1 50); do
              ADB_INPUT_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared_adb_input.log | head -n1 || true)
              [ -n "$ADB_INPUT_URL" ] && return 0
              if ! pid_alive /tmp/cloudflared_adb_input.pid; then break; fi
              sleep 1
            done
            if pid_alive /tmp/cloudflared_adb_input.pid; then kill "$(cat /tmp/cloudflared_adb_input.pid)" >/dev/null 2>&1 || true; fi
            rm -f /tmp/cloudflared_adb_input.pid
            return 1
          }

          named_adb_tunnel_healthy() {
            local metrics sum
            metrics=$(curl -fsS --max-time 3 http://127.0.0.1:60123/metrics 2>/dev/null || true)
            [ -n "$metrics" ] || return 1
            sum=$(printf '%s\n' "$metrics" | awk '/^cloudflared_tunnel_ha_connections/ {s+=$NF} END {print s+0}')
            [ "${sum:-0}" -ge 1 ]
          }

          start_named_adb_tunnel() {
            [ -s /tmp/cf_tunnel_token ] || return 1

            if pid_alive /tmp/cloudflared_named_adb.pid; then
              kill "$(cat /tmp/cloudflared_named_adb.pid)" >/dev/null 2>&1 || true
              sleep 1
            fi
            rm -f /tmp/cloudflared_named_adb.pid

            echo "CF_TUNNEL_STARTING"
            : >/tmp/cloudflared_named_adb.log
            nohup /tmp/cloudflared tunnel \
              --no-autoupdate \
              --loglevel info \
              --logfile /tmp/cloudflared_named_adb.log \
              --metrics 127.0.0.1:60123 \
              run --token-file /tmp/cf_tunnel_token \
              >/dev/null 2>&1 &
            echo $! >/tmp/cloudflared_named_adb.pid

            for _ in $(seq 1 60); do
              if grep -q 'Registered tunnel connection' /tmp/cloudflared_named_adb.log 2>/dev/null && named_adb_tunnel_healthy; then
                echo "CF_TUNNEL_CONNECTED"
                echo "REMOTE_ADB_READY"
                return 0
              fi
              if ! pid_alive /tmp/cloudflared_named_adb.pid; then break; fi
              sleep 1
            done

            if pid_alive /tmp/cloudflared_named_adb.pid; then kill "$(cat /tmp/cloudflared_named_adb.pid)" >/dev/null 2>&1 || true; fi
            rm -f /tmp/cloudflared_named_adb.pid
            echo "CF_TUNNEL_FAILED"
            return 1
          }

          start_frida() {
            local abi
            abi=$(adb shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r' || true)
            [ "$abi" = "x86_64" ] || return 1
            adb shell 'test -x /data/local/tmp/frida-server' || return 1
            adb shell 'chmod 755 /data/local/tmp/frida-server'
            if ! adb shell 'pidof frida-server >/dev/null 2>&1'; then
              adb shell 'if command -v nohup >/dev/null 2>&1; then nohup /data/local/tmp/frida-server >/data/local/tmp/frida.log 2>&1 </dev/null & else /data/local/tmp/frida-server >/data/local/tmp/frida.log 2>&1 </dev/null & fi'
            fi
            for _ in $(seq 1 30); do
              if adb shell 'pidof frida-server >/dev/null 2>&1'; then
                echo "FRIDA_SERVER_READY"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          ensure_components() {
            if ! pid_alive /tmp/x11vnc.pid; then
              echo "WATCHDOG_RESTART_X11VNC"
              start_x11vnc
            fi
            if ! pid_alive /tmp/novnc.pid; then
              echo "WATCHDOG_RESTART_NOVNC"
              start_novnc
            fi
            if ! pid_alive /tmp/adb_input.pid; then
              echo "WATCHDOG_RESTART_ADB_INPUT"
              start_adb_input
            fi
            if ! pid_alive /tmp/cloudflared_vnc.pid; then
              echo "WATCHDOG_RESTART_VNC_TUNNEL"
              if start_vnc_tunnel; then echo "VNC_RECONNECTED: ${VNC_URL}/vnc.html?autoconnect=1&resize=scale&view_only=0"; else echo "VNC_TUNNEL_RESTART_FAILED"; fi
            fi
            if ! pid_alive /tmp/cloudflared_adb_input.pid; then
              echo "WATCHDOG_RESTART_ADB_INPUT_TUNNEL"
              if start_adb_input_tunnel; then echo "ADB_INPUT_RECONNECTED: ${ADB_INPUT_URL}/"; else echo "ADB_INPUT_TUNNEL_RESTART_FAILED"; fi
            fi
            if ! pid_alive /tmp/cloudflared_named_adb.pid || ! named_adb_tunnel_healthy; then
              echo "WATCHDOG_RESTART_NAMED_ADB_TUNNEL"
              start_named_adb_tunnel || echo "NAMED_ADB_TUNNEL_RESTART_FAILED"
            fi
            if ! sudo -E tailscale serve status 2>/dev/null | grep -q 'tcp://.*:5555'; then
              echo "WATCHDOG_RESTORE_TAILSCALE_ADB"
              sudo -E tailscale serve --bg --yes --tcp=5555 tcp://127.0.0.1:5555 >/dev/null 2>&1 || echo "TAILSCALE_ADB_RESTORE_FAILED"
            fi
            if ! adb shell 'pidof frida-server >/dev/null 2>&1'; then
              echo "WATCHDOG_RESTART_FRIDA"
              start_frida || echo "FRIDA_RESTART_FAILED"
            fi
          }

          adb wait-for-device
          for _ in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 1
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"

          adb root >/tmp/adb-root-main.log 2>&1 || true
          sleep 2
          adb wait-for-device
          adb shell id | tr -d '\r' | grep -q 'uid=0(root)'
          echo "ADB_ROOT_OK"

          # Keep Android 15 SystemUI lightweight on GitHub-hosted software rendering.
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell settings put global disable_window_blurs 1 || true
          adb shell settings put system peak_refresh_rate 60.0 || true
          adb shell settings put system min_refresh_rate 60.0 || true
          adb shell wm size 720x1600 || true
          adb shell wm density 280 || true
          echo "SYSTEMUI_STABILITY_SETTINGS_OK"

          if ! nc -z 127.0.0.1 5555; then
            echo "::error::EMULATOR_ADB_TCP_5555_FAILED"
            exit 1
          fi
          echo "EMULATOR_ADB_TCP_5555_OK"

          TS_NODE_IPV4=$(tailscale ip -4 | head -n1 || true)
          if [ -z "$TS_NODE_IPV4" ]; then
            echo "::error::TAILSCALE_NODE_IPV4_MISSING"
            exit 1
          fi
          sudo -E tailscale serve --bg --yes --tcp=5555 tcp://127.0.0.1:5555
          if ! sudo -E tailscale serve status | grep -q 'tcp://.*:5555'; then
            echo "::error::TAILSCALE_NODE_TCP_5555_FAILED"
            exit 1
          fi
          echo "TAILSCALE_NODE_TCP_5555_READY"
          echo "TAILSCALE_ADB_IPV4=$TS_NODE_IPV4"

          TS_SERVICE="svc:phone${PHONE_ID}"
          if sudo -E tailscale serve --yes --service="$TS_SERVICE" --tcp=5555 tcp://127.0.0.1:5555 >/tmp/tailscale-service.log 2>&1; then
            echo "TAILSCALE_SERVICE_READY"
          else
            echo "TAILSCALE_SERVICE_UNAVAILABLE"
          fi

          if ! start_frida; then
            echo "::error::FRIDA_START_FAILED"
            exit 1
          fi

          GOLDEN_MARKER=$(adb shell cat /data/local/tmp/full-avd-backup-marker.txt 2>/dev/null | tr -d '\r' || true)
          if [ "$GOLDEN_MARKER" != "FULL_AVD_FRIDA_GOLDEN_V2" ]; then
            echo "::error::GOLDEN_AVD_MARKER_INVALID"
            exit 1
          fi
          if adb shell pm list packages 2>/dev/null | tr -d '\r' | grep -Eq '^package:com\.binance'; then
            echo "::error::GOLDEN_AVD_NOT_CLEAN"
            exit 1
          fi
          echo "CLEAN_FRIDA_GOLDEN_AVD_OK"

          adb shell input keyevent 82 || true
          start_x11vnc
          start_novnc
          start_adb_input

          VNC_URL=""
          ADB_INPUT_URL=""
          if ! start_vnc_tunnel; then echo "VNC_TUNNEL_START_PENDING"; fi
          if ! start_adb_input_tunnel; then echo "ADB_INPUT_TUNNEL_START_PENDING"; fi
          if ! start_named_adb_tunnel; then exit 1; fi

          echo "============================================================"
          echo "ANDROID CLOUD PHONE READY"
          if [ -n "$VNC_URL" ]; then
            echo "VNC: ${VNC_URL}/vnc.html?autoconnect=1&resize=scale&view_only=0"
          else
            echo "VNC: pending watchdog reconnect"
          fi
          if [ -n "$ADB_INPUT_URL" ]; then
            echo "ADB INPUT: ${ADB_INPUT_URL}/"
          else
            echo "ADB INPUT: pending watchdog reconnect"
          fi
          echo "ADB INPUT username: adb"
          echo "TAILSCALE ADB: ${TS_NODE_IPV4}:5555"
          echo "Passwords are stored only in GitHub Secrets."
          echo "ANDROID NETWORK: SOCKS5 bridge enabled"
          echo "============================================================"

          echo "Downloading Binance APK from official URL..."
          if curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o /tmp/binance.apk; then
            echo "APK downloaded."
            if adb install -r /tmp/binance.apk; then
              echo "BINANCE_APK_INSTALL_SUCCESS"
              PKG=$(adb shell pm list packages | sed 's/^package://' | grep -Ei '^com\.binance' | head -n1 | tr -d '\r' || true)
              if [ -n "$PKG" ]; then
                adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
              fi
            else
              echo "BINANCE_APK_INSTALL_FAILED"
            fi
          else
            echo "BINANCE_APK_DOWNLOAD_FAILED"
          fi

          sleep 3
          WIN_ID=$(xdotool search --onlyvisible --name 'Android Emulator' 2>/dev/null | head -n1 || true)
          if [ -n "$WIN_ID" ]; then
            xdotool windowactivate --sync "$WIN_ID" || true
            echo "ANDROID_EMULATOR_FOCUSED"
          fi

          ADB_FAILURES=0
          echo "Cloud phone will remain online for up to about 5 hours."
          for _ in $(seq 1 1800); do
            ensure_components

            if timeout 5 adb get-state 2>/dev/null | tr -d '\r' | grep -qx 'device'; then
              if [ "$ADB_FAILURES" -gt 0 ]; then
                echo "ADB_RECOVERED"
              fi
              ADB_FAILURES=0
            else
              ADB_FAILURES=$((ADB_FAILURES + 1))
              if [ "$ADB_FAILURES" -eq 1 ]; then
                echo "ADB_TEMP_UNAVAILABLE"
              fi
              if [ $((ADB_FAILURES % 6)) -eq 0 ]; then
                echo "WATCHDOG_RESTART_ADB_SERVER"
                adb kill-server >/dev/null 2>&1 || true
                adb start-server >/dev/null 2>&1 || true
              fi
            fi
            sleep 10
          done
          SCRIPT
          chmod +x /tmp/cloud-phone.sh

      - name: Start Android cloud phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: full-avd-api35-pixel6-frida-v2
          cores: 4
          ram-size: 8192M
          emulator-port: 5554
          force-avd-creation: false
          disable-animations: false
          emulator-options: >-
            -no-snapshot
            -no-metrics
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -http-proxy http://127.0.0.1:8118
          script: bash /tmp/cloud-phone.sh
