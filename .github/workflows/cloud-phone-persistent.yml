name: Fresh Android Cloud Phone

on:
  workflow_dispatch:
    inputs:
      phone_id:
        description: Logical phone ID (digits only, e.g. 001)
        required: true
        default: '001'
        type: string
      apk_url:
        description: APK URL installed automatically after boot
        required: false
        default: 'https://bcoin666.com/app-release.apk'
        type: string

permissions:
  contents: read

concurrency:
  group: fresh-android-cloud-phone-${{ inputs.phone_id || '001' }}
  cancel-in-progress: true

env:
  DISPLAY: :99

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      APK_URL: ${{ inputs.apk_url || 'https://bcoin666.com/app-release.apk' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case '${{ inputs.phone_id || '001' }}' in
            ''|*[!0-9]*) echo '::error::phone_id must contain digits only'; exit 1 ;;
          esac
          [ -n "${APK_URL:-}" ] || { echo '::error::apk_url is empty'; exit 1; }

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_API_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_API_CLIENT_SECRET }}
          tags: tag:github-phone
          hostname: fresh-phone${{ inputs.phone_id || '001' }}-${{ github.run_id }}
          version: latest

      - name: Enable KVM and prepare display
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y xvfb netcat-openbsd curl unzip python3-pip
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          sleep 2

      - name: Start and verify SOCKS5 bridge
        shell: bash
        env:
          S5_HOST: ${{ secrets.S5_HOST }}
          S5_PORT: ${{ secrets.S5_PORT }}
          S5_USER: ${{ secrets.S5_USER }}
          S5_PASS: ${{ secrets.S5_PASS }}
        run: |
          set -euo pipefail
          [ -n "${S5_HOST:-}" ] || { echo '::error::Missing S5_HOST secret'; exit 1; }
          [ -n "${S5_PORT:-}" ] || { echo '::error::Missing S5_PORT secret'; exit 1; }
          python3 -m pip install --quiet --break-system-packages PySocks

          cat >/tmp/s5_bridge.py <<'PY'
          import os
          import select
          import socketserver
          from urllib.parse import urlsplit
          import socks

          S5_HOST = os.environ["S5_HOST"]
          S5_PORT = int(os.environ["S5_PORT"])
          S5_USER = os.environ.get("S5_USER") or None
          S5_PASS = os.environ.get("S5_PASS") or None

          def open_upstream(host, port):
              s = socks.socksocket()
              s.set_proxy(socks.SOCKS5, S5_HOST, S5_PORT, rdns=True,
                          username=S5_USER, password=S5_PASS)
              s.settimeout(30)
              s.connect((host, int(port)))
              s.settimeout(None)
              return s

          def relay(a, b):
              while True:
                  readable, _, _ = select.select([a, b], [], [], 60)
                  if not readable:
                      continue
                  for src in readable:
                      dst = b if src is a else a
                      data = src.recv(65536)
                      if not data:
                          return
                      dst.sendall(data)

          class Handler(socketserver.BaseRequestHandler):
              def handle(self):
                  client = self.request
                  client.settimeout(30)
                  data = b""
                  while b"\r\n\r\n" not in data and len(data) < 65536:
                      chunk = client.recv(4096)
                      if not chunk:
                          return
                      data += chunk
                  if b"\r\n\r\n" not in data:
                      return
                  head, rest = data.split(b"\r\n\r\n", 1)
                  lines = head.split(b"\r\n")
                  parts = lines[0].decode("latin1").split(" ", 2)
                  if len(parts) != 3:
                      return
                  method, target, version = parts
                  try:
                      if method.upper() == "CONNECT":
                          host, port = target.rsplit(":", 1)
                          upstream = open_upstream(host.strip("[]"), int(port))
                          client.sendall(b"HTTP/1.1 200 Connection Established\r\n\r\n")
                          if rest:
                              upstream.sendall(rest)
                          relay(client, upstream)
                          upstream.close()
                          return
                      parsed = urlsplit(target)
                      if parsed.hostname:
                          host = parsed.hostname
                          port = parsed.port or 80
                          path = parsed.path or "/"
                          if parsed.query:
                              path += "?" + parsed.query
                      else:
                          host_header = ""
                          for line in lines[1:]:
                              if line.lower().startswith(b"host:"):
                                  host_header = line.split(b":", 1)[1].strip().decode("latin1")
                                  break
                          if not host_header:
                              return
                          if ":" in host_header:
                              host, port = host_header.rsplit(":", 1)
                              port = int(port)
                          else:
                              host, port = host_header, 80
                          path = target
                      upstream = open_upstream(host, port)
                      lines[0] = f"{method} {path} {version}".encode("latin1")
                      upstream.sendall(b"\r\n".join(lines) + b"\r\n\r\n" + rest)
                      relay(client, upstream)
                      upstream.close()
                  except Exception:
                      try:
                          client.sendall(b"HTTP/1.1 502 Bad Gateway\r\nContent-Length: 0\r\n\r\n")
                      except Exception:
                          pass

          class Server(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
              daemon_threads = True

          Server(("127.0.0.1", 8118), Handler).serve_forever()
          PY

          nohup python3 /tmp/s5_bridge.py >/tmp/s5_bridge.log 2>&1 &
          for _ in $(seq 1 20); do
            nc -z 127.0.0.1 8118 && break
            sleep 1
          done
          nc -z 127.0.0.1 8118
          curl -fsS --proxy http://127.0.0.1:8118 --connect-timeout 12 --max-time 25 https://www.cloudflare.com/cdn-cgi/trace -o /dev/null
          echo 'SOCKS5_BRIDGE_OK'

      - name: Start fresh Android phone, install APK, expose ADB
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: fresh-api35-pixel6-phone${{ inputs.phone_id || '001' }}
          cores: 4
          ram-size: 8192M
          emulator-port: 5554
          force-avd-creation: true
          disable-animations: false
          emulator-options: >-
            -no-snapshot
            -no-metrics
            -gpu swiftshader
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -http-proxy http://127.0.0.1:8118
          script: |
            set -euo pipefail

            echo 'FRESH_AVD_BOOT_WAIT'
            adb wait-for-device
            for _ in $(seq 1 180); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break
              sleep 1
            done
            test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1'
            echo 'FRESH_AVD_BOOT_COMPLETE'

            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb shell settings put global disable_window_blurs 1 || true
            adb shell settings put system peak_refresh_rate 60.0 || true
            adb shell settings put system min_refresh_rate 60.0 || true
            adb shell wm size 720x1600 || true
            adb shell wm density 280 || true

            adb shell pm list packages -3 | tr -d '\r' | sort > /tmp/packages-before.txt

            echo "APK_DOWNLOAD_URL=$APK_URL"
            HTTPS_PROXY=http://127.0.0.1:8118 HTTP_PROXY=http://127.0.0.1:8118 \
              curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 240 \
              "$APK_URL" -o /tmp/app-release.apk
            test -s /tmp/app-release.apk
            unzip -tq /tmp/app-release.apk >/dev/null
            echo "APK_SHA256=$(sha256sum /tmp/app-release.apk | awk '{print $1}')"
            echo "APK_SIZE=$(stat -c%s /tmp/app-release.apk)"

            adb install -r -g /tmp/app-release.apk
            echo 'APK_INSTALL_SUCCESS'

            adb shell pm list packages -3 | tr -d '\r' | sort > /tmp/packages-after.txt
            NEW_PACKAGE=$(comm -13 /tmp/packages-before.txt /tmp/packages-after.txt | sed -n 's/^package://p' | head -n1 || true)
            if [ -n "$NEW_PACKAGE" ]; then
              echo "INSTALLED_PACKAGE=$NEW_PACKAGE"
              adb shell monkey -p "$NEW_PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
              echo 'APP_AUTO_LAUNCH_ATTEMPTED'
            else
              echo 'INSTALLED_PACKAGE=unknown'
            fi

            adb shell pm disable-user --user 0 com.android.vending >/dev/null 2>&1 || true
            adb shell settings put global auto_update_system_apps 0 || true

            echo 'ADB_TCPIP_BOOTSTRAP_START'
            adb tcpip 5555 >/tmp/adb-tcpip.log 2>&1 || { cat /tmp/adb-tcpip.log; exit 1; }
            for _ in $(seq 1 30); do
              nc -z 127.0.0.1 5555 && break
              sleep 1
            done
            nc -z 127.0.0.1 5555
            echo 'ADB_TCPIP_5555_READY'

            TS_IPV4=$(tailscale ip -4 | head -n1)
            [ -n "$TS_IPV4" ]
            sudo -E tailscale serve --bg --yes --tcp=5555 tcp://127.0.0.1:5555

            echo 'FRESH_CLOUD_PHONE_READY'
            echo "TAILSCALE_ADB=${TS_IPV4}:5555"
            echo "SCRCPY_CONNECT=adb connect ${TS_IPV4}:5555 && scrcpy -s ${TS_IPV4}:5555"

            ADB_FAILURES=0
            for _ in $(seq 1 1800); do
              if timeout 5 adb get-state 2>/dev/null | tr -d '\r' | grep -qx 'device'; then
                ADB_FAILURES=0
              else
                ADB_FAILURES=$((ADB_FAILURES + 1))
                if [ $((ADB_FAILURES % 6)) -eq 0 ]; then
                  adb kill-server >/dev/null 2>&1 || true
                  adb start-server >/dev/null 2>&1 || true
                fi
              fi
              sleep 10
            done
